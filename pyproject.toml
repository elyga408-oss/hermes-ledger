[project]
name = "hermes-ledger"
version = "0.1.0"
description = "Tamper-evident, signed flight recorder for Hermes Agent tool calls"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42,<51",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
